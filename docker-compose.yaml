services:
  mcpguard-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SCOPE=docker
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - MCPGUARD_API_KEYS=${MCPGUARD_API_KEYS:-}
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      - DATABASE_URL=${DATABASE_URL:-postgres://mcpguard:mcpguard@postgres:5432/mcpguard?sslmode=disable}
    volumes:
      - mcpguard-storage:/app/mcpguard-local-storage
    depends_on:
      localstack:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mcpguard
      POSTGRES_PASSWORD: mcpguard
      POSTGRES_DB: mcpguard
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpguard -d mcpguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - queue
      - all

  mcpguard-worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - MODE=worker
      - SCOPE=docker
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      - DATABASE_URL=${DATABASE_URL:-postgres://mcpguard:mcpguard@postgres:5432/mcpguard?sslmode=disable}
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-default-webhook-secret}
      - MCPGUARD_API_KEYS=${MCPGUARD_API_KEYS:-dev-client:dev-key}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - mcpguard-storage:/app/mcpguard-local-storage
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - queue
      - all

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    profiles:
      - observability
      - all

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro
    profiles:
      - observability
      - all

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor
      - node-exporter
    profiles:
      - observability
      - all

  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    profiles:
      - observability
      - all

  promtail:
    image: grafana/promtail:3.0.0
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./deploy/promtail/promtail.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    profiles:
      - observability
      - all

  grafana:
    image: grafana/grafana:11.1.0
    volumes:
      - ./deploy/grafana/provisioning/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./deploy/grafana/provisioning/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards
      - ./deploy/grafana/custom.ini:/etc/grafana/grafana.ini
      - ./deploy/grafana/custom.css:/etc/grafana/custom.css
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      # Silence noisy anonymous-user auth warnings — only surface real errors.
      - GF_LOG_FILTERS=authn.service:error tsdb.loki:error
    depends_on:
      - prometheus
      - loki
    profiles:
      - observability
      - all

  localstack:
    image: localstack/localstack:3.8
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mcpguard-storage:
  localstack-data:
  postgres-data:
  rabbitmq-data:
