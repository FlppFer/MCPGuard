scope: "production"
log-level: "error"

data_base:
  mock: false

object_storage:
  mock: false
  base-path: "./storage"
  s3:
    bucket: "mcpguard-artifacts"
    region: "us-east-1"
    endpoint: ""
    force-path-style: false

# Authentication - enabled in production
# API keys should be set via environment variable MCPGUARD_API_KEYS (comma-separated)
auth:
  enabled: true
  api_keys: []