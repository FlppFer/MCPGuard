scope: "production"
log-level: "error"

data_base:
  mock: false

object_storage:
  mock: false
  base-path: "./storage"
  s3:
    bucket: "mcpguard-artifacts"
    region: "us-east-1"
    endpoint: ""
    force-path-style: false

# Authentication Configuration
# All values are env var names - the app will panic if any env var is not set
auth:
  webhook_secret_key: "GITHUB_WEBHOOK_SECRET"
  api_keys_key: "MCPGUARD_API_KEYS"