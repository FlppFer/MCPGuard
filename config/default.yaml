scope: "default"
log-level: "debug"

data_base:
  mock: true

object_storage:
  mock: true
  base-path: "mcpguard-local-storage"

# Authentication Configuration
# All values are env var names - the app will panic if any env var is not set
auth:
  webhook_secret_key: "GITHUB_WEBHOOK_SECRET"  # For GitHub webhook signature verification
  api_keys_key: "MCPGUARD_API_KEYS"            # Format: "client_id:api_key,client_id2:api_key2"