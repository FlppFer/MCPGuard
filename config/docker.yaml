scope: "docker"
log-level: "info"

data_base:
  # Overridden at runtime by DATABASE_URL env var (docker-compose sets it to the
  # local postgres service). Left as mock for safety if the env var is missing.
  mock: true

object_storage:
  provider: "localstack"
  base-path: "mcpguard-local-storage"

auth:
  webhook_secret_key: "GITHUB_WEBHOOK_SECRET"
  api_keys_key: "MCPGUARD_API_KEYS"

messaging:
  enabled: false
  rabbitmq_url: ""

github_integration:
  enabled: true
  token_env_var: "GITHUB_TOKEN"

agentic:
  enabled: true
  mock: false
  worker_url: "http://host.docker.internal:5000"
